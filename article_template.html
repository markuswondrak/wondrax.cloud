<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="{{excerpt}}">
  <title>{{title}} — Markus Wondrak</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&family=Sora:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css?v=3">
</head>
<body>
  <div class="reading-progress" id="reading-progress"></div>

  <header class="masthead masthead--compact">
    <div class="container">
      <a href="../index.html" class="logo">Markus Wondrak</a>
    </div>
  </header>

  <main>
    <article class="article-page">
      <header class="article-header">
        <div class="container container--narrow">
          <a href="../index.html" class="back-link">← Back to all writing</a>
          <div class="article-meta">
            <time datetime="{{date_iso}}">{{date_display}}</time>
            {{reading_time_html}}
          </div>
          <h1 class="article-headline">{{title}}</h1>
          {{tags_html}}
        </div>
      </header>

      {{hero_image_html}}

      <div class="article-body">
        <div class="container container--narrow">
          {{content}}
        </div>
      </div>

      <footer class="article-footer">
        <div class="container container--narrow">
          <a href="../index.html" class="back-link">← Back to all writing</a>
        </div>
      </footer>
    </article>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© 2026 Markus Wondrak</p>
    </div>
  </footer>

  <script>
    (function() {
      var progressBar = document.getElementById('reading-progress');
      if (!progressBar) return;
      function updateProgress() {
        var scrollTop = window.scrollY || document.documentElement.scrollTop;
        var docHeight = document.documentElement.scrollHeight - document.documentElement.clientHeight;
        var progress = docHeight > 0 ? (scrollTop / docHeight) * 100 : 0;
        progressBar.style.width = progress + '%';
      }
      window.addEventListener('scroll', updateProgress, { passive: true });
      updateProgress();
    })();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
  <script>
    mermaid.initialize({
      startOnLoad: false,
      theme: 'base',
      themeVariables: {
        primaryColor: '#EDE8DC',
        primaryTextColor: '#1A1714',
        primaryBorderColor: '#DDD8CE',
        lineColor: '#7C766E',
        secondaryColor: '#F3EFE6',
        tertiaryColor: '#F3EFE6',
        fontFamily: "'Source Serif 4', Georgia, serif"
      },
      flowchart: { useMaxWidth: true },
      sequence: { useMaxWidth: true },
      c4: { useMaxWidth: true }
    });
    mermaid.run().catch(function (err) { console.error('Mermaid:', err); });
  </script>
</body>
</html>
